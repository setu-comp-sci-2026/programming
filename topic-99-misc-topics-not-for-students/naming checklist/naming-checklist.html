<title>Naming Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f5f8fb; --panel:#ffffff; --ink:#1b2733; --muted:#5a6b7b; --line:#dbe3ea;
  --accent:#3572A5; --accent-soft:#dbeafe; --do:#1f7a44; --dont:#c2323f;
  --note:#e3f5e4; --note-line:#4caf50; --code-bg:#eef3f8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171d; --panel:#18212a; --ink:#e4ebf1; --muted:#98a8b6; --line:#2a3743;
    --accent:#7fb0dc; --accent-soft:#1d3247; --do:#5fcf8d; --dont:#ff7b86;
    --note:#1b3322; --note-line:#4caf50; --code-bg:#202b36;
  }
}
:root[data-theme="dark"]{
  --bg:#11171d; --panel:#18212a; --ink:#e4ebf1; --muted:#98a8b6; --line:#2a3743;
  --accent:#7fb0dc; --accent-soft:#1d3247; --do:#5fcf8d; --dont:#ff7b86;
  --note:#1b3322; --note-line:#4caf50; --code-bg:#202b36;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;padding-inline:16px;padding-block:16px 32px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:6px}
h1{margin:0;font-size:1.35rem;font-weight:700;text-wrap:balance;color:var(--ink)}
h1 span{color:var(--accent)}
.bar{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.meter{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
button{font:inherit;font-size:.8rem;color:var(--accent);background:none;border:1px solid var(--line);border-radius:4px;padding:2px 8px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rule{background:var(--note);border-left:3px solid var(--note-line);padding:8px 10px;font-size:.9rem}
h2{margin:6px 0 0;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}
td{border-top:1px solid var(--line);padding:8px 10px;vertical-align:top}
tr:first-child td{border-top:none}
td.chk{width:34px;padding-right:0}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);margin:2px 0 0;cursor:pointer}
label{display:block;font-weight:600;cursor:pointer}
tr.done label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.ex{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px;font:12.5px/1.4 "JetBrains Mono",ui-monospace,Menlo,monospace}
.ex .y{color:var(--do)} .ex .n{color:var(--dont)}
.ex code{background:var(--code-bg);padding:0 4px;border-radius:3px;color:var(--ink);font:inherit}
footer{font-size:.8rem;color:var(--muted)}
</style>

<div class="wrap">
  <header>
    <h1>Naming <span>checklist</span></h1>
    <div class="bar"><div class="meter"><i id="m"></i></div><span id="count">0 / 0</span><button id="reset" type="button">Clear</button></div>
  </header>

  <div class="rule"><b>The "and" test:</b> if you can't describe a function in one sentence without "and", split it. A hard-to-name function usually has a design problem.</div>

  <h2>Functions</h2>
  <table><tbody id="fn"></tbody></table>

  <h2>Variables</h2>
  <table><tbody id="var"></tbody></table>

  <h2>Style (PEP 8)</h2>
  <table><tbody id="sty"></tbody></table>

  <footer>Ticks are saved in this browser only. Use them to check a program before you submit it.</footer>
</div>

<script>
const R = {
  fn: [
    ["One job, one verb, no “and”", "validate_student()", "validate_and_save()"],
    ["Specific, not vague", "remove_duplicate_emails()", "process(data)"],
    ["Name the intent, not the algorithm", "rank_scores()", "bubble_sort_scores()"],
    ["Honest: get_ never changes state", "charge_fee() + get_balance()", "get_balance() that deducts"],
    ["Booleans ask a question", "is_valid(), has_passed()", "check(s)"],
    ["Grammar fits the return", "send_(), to_(), find_()", "do_it()"],
    ["No True/False flag parameters", "print_summary()", "print_report(s, True)"],
    ["A long name means split it", "read_rows() → average()", "read_parse_and_average()"],
    ["One word per concept", "get_ everywhere", "get_ / fetch_ / retrieve_"]
  ],
  var: [
    ["Plural for collections, singular for items", "for student in students", "student_list"],
    ["No cryptic abbreviations", "total_amount", "ttl_amt"],
    ["Named constants, not magic numbers", "PASS_MARK = 40", "if mark >= 40"],
    ["Positive booleans", "is_empty", "is_not_empty"],
    ["Don't shadow built-ins", "total", "sum, list, max, id"]
  ],
  sty: [
    ["snake_case functions and variables", "calculate_grade", "calculateGrade"],
    ["UPPER_CASE constants, PascalCase classes", "MAX_TRIES, Student", "maxTries, student"],
    ["Leading _ for internal helpers", "_format_row()", "helper2()"]
  ]
};
const KEY = "naming-checklist-v1";
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
let total = 0;
for (const [g, rows] of Object.entries(R)) {
  const tb = document.getElementById(g);
  rows.forEach(([rule, yes, no], i) => {
    const id = g + "-" + i; total++;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="chk"><input type="checkbox" id="${id}"></td>
      <td><label for="${id}">${esc(rule)}</label>
      <div class="ex"><span class="y">✔ <code>${esc(yes)}</code></span><span class="n">✘ <code>${esc(no)}</code></span></div></td>`;
    const cb = tr.querySelector("input");
    cb.checked = !!saved[id];
    tr.classList.toggle("done", cb.checked);
    cb.addEventListener("change", () => {
      saved[id] = cb.checked; tr.classList.toggle("done", cb.checked);
      try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {}
      update();
    });
    tb.appendChild(tr);
  });
}
function update(){
  const n = document.querySelectorAll("input[type=checkbox]:checked").length;
  document.getElementById("count").textContent = n + " / " + total;
  document.getElementById("m").style.width = (100 * n / total) + "%";
}
document.getElementById("reset").addEventListener("click", () => {
  saved = {}; try { localStorage.removeItem(KEY); } catch (e) {}
  document.querySelectorAll("input[type=checkbox]").forEach(c => { c.checked = false; c.closest("tr").classList.remove("done"); });
  update();
});
update();
</script>
